<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Americana New Tab</title>
<meta name="description" content="A pixel-art new tab page with a clock, search and six American scenes.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Public+Sans:ital,wght@0,400;0,600;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#0B1730; --ink:#F4F1EA; --accent:#F4D27A; --scrim:rgba(6,16,31,.55);
  --display:'Silkscreen', ui-monospace, 'Courier New', monospace; --body:'Public Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); overflow:hidden; transition:background .4s; }
.scene { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none; }
.scene img { width:max(100vw, calc(100vh * 1920 / 720 * .78)); max-width:none; height:auto; image-rendering:pixelated; display:block; }
main { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; padding:clamp(28px,11vh,120px) 16px 0; text-align:center; }
.clock { font:700 clamp(56px,11vw,132px)/1 var(--display); letter-spacing:.02em; font-variant-numeric:tabular-nums; text-shadow:5px 5px 0 rgba(0,0,0,.35); }
.date { font:500 clamp(12px,1.5vw,15px)/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; margin-top:14px; opacity:.9; }
form { margin-top:clamp(20px,4vh,40px); width:min(560px, 100%); display:flex; }
input[type=search] { flex:1; min-width:0; font:16px var(--body); padding:14px 16px; border:0; background:rgba(255,255,255,.94); color:#111; }
form button { font:700 12px var(--display); letter-spacing:.08em; padding:0 18px; border:0; background:var(--accent); color:#111; cursor:pointer; }
.picker { position:fixed; z-index:2; left:0; right:0; margin-inline:auto; width:fit-content; bottom:16px; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; padding:8px; background:var(--scrim); max-width:calc(100vw - 32px); }
.picker button { font:700 11px/1 var(--display); letter-spacing:.05em; padding:9px 10px; border:2px solid transparent; background:transparent; color:#fff; cursor:pointer; white-space:nowrap; }
.picker button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
.picker button:focus-visible, input:focus-visible, form button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.home { position:fixed; z-index:2; top:14px; left:16px; font:700 11px var(--display); letter-spacing:.06em; color:var(--ink); opacity:.75; text-decoration:none; }
.auto-note { margin-top:12px; font:500 12px var(--mono); letter-spacing:.1em; text-transform:uppercase; opacity:.8; min-height:1em; }
</style>
</head>
<body>
<a class="home" href="index.html">PIXEL AMERICANA</a>
<div class="scene" aria-hidden="true"><img id="art" src="assets/img/old-glory-newtab.png" alt=""></div>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <form action="https://www.google.com/search" method="get" role="search">
    <label for="q" style="position:absolute;left:-9999px">Search Google</label>
    <input type="search" id="q" name="q" placeholder="Search Google" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div class="auto-note" id="auto-note"></div>
</main>
<nav class="picker" id="picker" aria-label="Choose a scene"></nav>
<script>
(() => {
  const SC = {"old-glory": {"title": "Old Glory", "img": "assets/img/old-glory-newtab.png", "ntp": "#0B1730", "text": "#F4F1EA", "link": "#F4D27A", "frame": "#B31942", "toolbar": "#0B1730"}, "open-road": {"title": "Open Road", "img": "assets/img/open-road-newtab.png", "ntp": "#2E2C64", "text": "#F6E3CC", "link": "#F2A65E", "frame": "#2A1830", "toolbar": "#3B2233"}, "haze-gray": {"title": "Haze Gray", "img": "assets/img/haze-gray-newtab.png", "ntp": "#2A3440", "text": "#E8ECEE", "link": "#FFD100", "frame": "#4E5354", "toolbar": "#828888"}, "national-park": {"title": "National Park", "img": "assets/img/national-park-newtab.png", "ntp": "#2F6F7E", "text": "#F7EEDC", "link": "#F7E2A6", "frame": "#1E3B30", "toolbar": "#2F6F7E"}, "tranquility-base": {"title": "Tranquility Base", "img": "assets/img/tranquility-base-newtab.png", "ntp": "#05070B", "text": "#F2F2F2", "link": "#F0A030", "frame": "#05070B", "toolbar": "#1A1B1E"}, "parchment": {"title": "Parchment", "img": "assets/img/parchment-newtab.png", "ntp": "#EFE3C8", "text": "#2B1D14", "link": "#9E2B25", "frame": "#D5C29A", "toolbar": "#EFE3C8"}};
  const ORDER = ["old-glory", "open-road", "haze-gray", "national-park", "tranquility-base", "parchment"];
  // time of day: dawn at sea, morning at the desk, day in the park, sunset on the road, evening flag, night on the Moon
  const SLOTS = [[5,'haze-gray','Dawn'],[8,'parchment','Morning'],[12,'national-park','Afternoon'],[17,'open-road','Sunset'],[20,'old-glory','Evening'],[22,'tranquility-base','Night']];
  const art = document.getElementById('art'), picker = document.getElementById('picker'), note = document.getElementById('auto-note');
  let choice = 'auto';
  try { choice = localStorage.getItem('pa-scene') || new URLSearchParams(location.search).get('scene') || 'auto'; } catch (e) {}
  const qs = new URLSearchParams(location.search).get('scene'); if (qs && SC[qs]) choice = qs;
  function slotFor(h) { let s = SLOTS[SLOTS.length - 1]; for (const x of SLOTS) if (h >= x[0]) s = x; return h < 5 ? SLOTS[SLOTS.length - 1] : s; }
  function apply() {
    let key = choice, label = '';
    if (choice === 'auto') { const s = slotFor(new Date().getHours()); key = s[1]; label = 'Time of day · ' + s[2] + ' · ' + SC[key].title; }
    const c = SC[key];
    if (art.getAttribute('src') !== c.img) art.src = c.img;
    document.body.style.background = c.ntp;
    document.documentElement.style.setProperty('--ink', c.text);
    document.documentElement.style.setProperty('--accent', c.link);
    note.textContent = label;
    picker.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === choice)));
  }
  [['auto', 'Time of day'], ...ORDER.map(k => [k, SC[k].title])].forEach(([k, t]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = t;
    b.addEventListener('click', () => { choice = k; try { localStorage.setItem('pa-scene', k); } catch (e) {} apply(); });
    picker.appendChild(b);
  });
  const clock = document.getElementById('clock'), date = document.getElementById('date');
  function tick() {
    const d = new Date();
    clock.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M$/i, '');
    date.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    if (choice === 'auto') apply();
  }
  apply(); tick(); setInterval(tick, 15000);
})();
</script>

</body>
</html>
