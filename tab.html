<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Americana New Tab</title>
<meta name="description" content="A pixel-art new tab page with a clock, search and six animated American scenes.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/newtab/newtab.css">
<script>window.PA_FRAMES = 'assets/frames/';</script>
<a class="home" href="index.html">PIXEL AMERICANA</a>
<div class="scene" aria-hidden="true"><canvas id="art" width="480" height="180"></canvas></div>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <form id="search" action="https://www.google.com/search" method="get" role="search">
    <label for="q" class="sr">Search</label>
    <input type="search" id="q" name="q" placeholder="Search Google" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>
  <div class="note" id="note"></div>
</main>
<nav class="bar" id="bar" aria-label="Scene and motion"></nav>
<script src="assets/newtab/newtab.js"></script>

</body>
</html>
